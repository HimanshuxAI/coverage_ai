openapi: 3.1.0
info:
  title: Generate Settlement Packet API
  description: Assembles the audit and decision-ready settlement packet for the human claims officer.
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-case-registry:
    get:
      summary: Generate Settlement Packet
      operationId: generateSettlementPacket
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            default: CASE-CT-REAL-001
      responses:
        '200':
          description: Settlement packet generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      current_case_status:
                        type: string
