openapi: 3.1.0
info:
  title: Validate Activated Case Handoff API
  description: Emits CASE_ACTIVATED_VALIDATED lifecycle event.
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-case-registry:
    get:
      summary: Validate Activated Case Handoff
      operationId: validateActivatedCaseHandoff
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            default: CASE-CT-REAL-001
      responses:
        '200':
          description: Activated case handoff validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      current_case_status:
                        type: string
