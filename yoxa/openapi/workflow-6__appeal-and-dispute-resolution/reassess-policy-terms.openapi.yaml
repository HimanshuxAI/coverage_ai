openapi: 3.1.0
info:
  title: Reassess Policy Terms API
  description: Re-evaluates disputed clauses, exclusion overrides, or special endorsement terms.
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-case-registry:
    get:
      summary: Reassess Policy Terms
      operationId: reassessPolicyTerms
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            default: CASE-CT-REAL-001
      responses:
        '200':
          description: Policy terms reassessed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      current_case_status:
                        type: string
