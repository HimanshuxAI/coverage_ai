openapi: 3.1.0
info:
  title: Store Human Outcome
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/submit-human-decision:
    post:
      operationId: storeHumanOutcome
      summary: Persists explicit insurer or TPA reviewer decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [case_id, packet_id, reviewer_identity, reviewer_role, outcome, written_reason, decision_timestamp]
              properties:
                case_id:
                  type: string
                packet_id:
                  type: string
                reviewer_identity:
                  type: string
                reviewer_role:
                  type: string
                outcome:
                  type: string
                  enum: [AUTHORISE, REQUEST_CLARIFICATION, DECLINE_OR_REDUCE]
                written_reason:
                  type: string
                decision_timestamp:
                  type: string
                authorised_amount:
                  type: number
                currency:
                  type: string
                clarification_fields:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Human decision stored
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: false
                    required: [persistence_status, human_decision_id, stored_case_status, outcome]
                    properties:
                      persistence_status:
                        type: string
                      human_decision_id:
                        type: string
                      stored_case_status:
                        type: string
                      outcome:
                        type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
