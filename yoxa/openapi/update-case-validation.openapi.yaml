openapi: 3.1.0
info:
  title: Update Case Registry Validation
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/validate-activation:
    post:
      operationId: updateCaseRegistryValidation
      summary: Validate dual-key activation and update case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [case_id]
              properties:
                case_id:
                  type: string
      responses:
        '200':
          description: Validation result stored
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: false
                    required: [case_id, stored_status, new_case_version, audit_event_id, idempotency_result]
                    properties:
                      case_id:
                        type: string
                      stored_status:
                        type: string
                      new_case_version:
                        type: integer
                      audit_event_id:
                        type: string
                      idempotency_result:
                        type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
