openapi: 3.1.0
info:
  title: Generate Decision-Ready Packet
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/generate-decision-packet:
    post:
      operationId: generateDecisionReadyPacket
      summary: Generate decision-ready packet metadata (and PDF attachment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [case_id]
              properties:
                case_id:
                  type: string
      responses:
        '200':
          description: Packet generated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: false
                    required: [packet_id, case_id, graph_version, new_case_status]
                    properties:
                      packet_id:
                        type: string
                      case_id:
                        type: string
                      graph_version:
                        type: integer
                      new_case_status:
                        type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
