openapi: 3.1.0
info:
  title: Consolidate Post-Care Records API
  description: Merges clinical, policy, and cost specialist extractions into a single consolidated post-care evaluation record.
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-case-registry:
    get:
      summary: Consolidate Post-Care Records
      operationId: consolidatePostCareRecords
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            default: CASE-CT-REAL-001
      responses:
        '200':
          description: Case registry data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      current_case_status:
                        type: string
