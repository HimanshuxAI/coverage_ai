openapi: 3.1.0
info:
  title: Extract Operative & OT Notes API
  description: Analyzes Discharge Summary, OT Notes, and clinical records to extract actual surgical findings, procedure performed, complications, and post-op condition.
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-case-registry:
    get:
      summary: Extract Operative & OT Notes
      operationId: extractOperativeOTNotes
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            default: CASE-CT-REAL-001
      responses:
        '200':
          description: Case registry data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      current_case_status:
                        type: string
