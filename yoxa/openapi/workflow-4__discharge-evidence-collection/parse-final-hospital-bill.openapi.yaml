openapi: 3.1.0
info:
  title: Parse Final Hospital Bill API
  description: Parses final itemized hospital bill line items, categorizing surgical fees, OT charges, pharmacy items, and non-payable convenience charges.
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-case-registry:
    get:
      summary: Parse Final Hospital Bill
      operationId: parseFinalHospitalBill
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            default: CASE-CT-REAL-001
      responses:
        '200':
          description: Case registry data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      current_case_status:
                        type: string
