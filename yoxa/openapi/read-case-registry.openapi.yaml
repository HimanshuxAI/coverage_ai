openapi: 3.1.0
info:
  title: Read Case Registry
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-case-registry:
    get:
      operationId: readCaseRegistry
      summary: Read the authoritative case record from the registry
      parameters:
        - name: case_id
          in: query
          required: true
          description: Unique identifier of the case
          schema:
            type: string
      responses:
        '200':
          description: Case record and audit history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: false
                    required: [case_id, case_version, current_case_status]
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      current_case_status:
                        type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
