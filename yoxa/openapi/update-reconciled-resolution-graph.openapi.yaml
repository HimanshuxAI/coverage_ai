openapi: 3.1.0
info:
  title: Update Reconciled Resolution Graph
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/update-reconciled-resolution-graph:
    post:
      operationId: update_reconciled_resolution_graph
      summary: Persists human reconciliation and updates the resolution graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - case_id
                - correlation_id
                - expected_case_version
                - graph_status
                - graph_version
                - idempotency_key
                - reconciles_graph_version
                - reconciliation_rationale
              properties:
                case_id:
                  type: string
                correlation_id:
                  type: string
                expected_case_version:
                  type: integer
                graph_status:
                  type: string
                graph_version:
                  type: integer
                idempotency_key:
                  type: string
                reconciles_graph_version:
                  type: integer
                reconciliation_rationale:
                  type: string
                assumptions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Reconciliation persisted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: false
                    required: [persistence_status, case_id, graph_version, graph_state, audit_event_id]
                    properties:
                      persistence_status:
                        type: string
                      case_id:
                        type: string
                      graph_version:
                        type: integer
                      graph_state:
                        type: string
                      audit_event_id:
                        type: string
