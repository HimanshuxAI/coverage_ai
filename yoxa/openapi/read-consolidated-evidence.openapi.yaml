openapi: 3.1.0
info:
  title: Read Consolidated Specialist Evidence
  version: 1.0.0
servers:
  - url: https://uzvqxpfdxwckhtvvjkzo.supabase.co
paths:
  /functions/v1/read-consolidated-evidence:
    get:
      operationId: readConsolidatedSpecialistEvidence
      summary: Returns the three complete specialist evidence reports
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
        - name: case_version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Consolidated specialist reports
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: false
                    required: [case_id, case_version, handoff_status]
                    properties:
                      case_id:
                        type: string
                      case_version:
                        type: integer
                      handoff_status:
                        type: string
                      policy_evidence_result:
                        type: object
                        additionalProperties: false
                      clinical_evidence_result:
                        type: object
                        additionalProperties: false
                      cost_contract_result:
                        type: object
                        additionalProperties: false
                      version_consistency:
                        type: object
                        additionalProperties: false

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
